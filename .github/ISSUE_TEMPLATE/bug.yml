name: Bug report
description: An answer this engine gives that it should not, or one it does not give.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Not for a security vulnerability. Report those privately by email, as
        [SECURITY.md](https://github.com/trueagi-io/PeTTa/blob/main/SECURITY.md)
        describes, because everything filed here is public from the moment it
        is filed.

        PeTTa is alpha and breaking changes are expected at every release, so
        say which commit or tag you saw this on. A behaviour that changed on
        purpose is still worth filing if the changelog does not say it did.

  - type: textarea
    id: program
    attributes:
      label: The MeTTa program
      description: >-
        The smallest program that shows it, as a file that runs unchanged.
        Trim it until taking one more line away makes the problem disappear.
      # `render` puts the answer in a code block instead of running it through
      # Markdown, which is what stops `*` and `_` in a program being eaten.
      # `text` rather than `metta`: MeTTa is a Linguist language, added
      # 2026-03-02 and live in GitHub's own language stats for this
      # repository, but its entry carries ace_mode: text and no bundled
      # grammar, so the two render identically and only one of them is certain
      # to be accepted. A rejected render value invalidates the whole form and
      # it silently stops appearing in the chooser.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: The answer you expected
      description: >-
        Write the answers the way the engine prints them, one group per `!`
        directive.
      placeholder: "[[42]]"
    validations:
      required: true

  - type: textarea
    id: got
    attributes:
      label: The answer you got
      description: >-
        Verbatim, error text and all. If the engine raised, paste the whole
        message rather than a summary of it.
    validations:
      required: true

  - type: dropdown
    id: door
    attributes:
      label: How you ran it
      description: >-
        The CLI and the Python library are held to identical answers by a
        differential suite, so a disagreement between them is itself the bug.
      options:
        - sh run.sh, the CLI
        - the petta Python library
        - both, and they agreed
        - both, and they disagreed
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The commit or tag you ran, and the SWI-Prolog and Python versions.
      placeholder: "4b71a0c, SWI-Prolog 10.1.13, Python 3.11.9"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >-
        A backend you built, a library you imported, or what you were doing
        when it came up.
    validations:
      required: false
