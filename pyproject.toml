[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "petta"
dynamic = ["version"]
description = "MeTTa in Python on the PeTTa engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "janus-swi>=1.5.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Prolog",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/patham9/PeTTa"
Repository = "https://github.com/patham9/PeTTa"
Issues = "https://github.com/patham9/PeTTa/issues"

[project.scripts]
petta = "petta.cli:main"

[project.entry-points."petta.integrations"]
measure = "petta.measure"

[project.optional-dependencies]
arrays = [
    "array-api-compat",
    "faiss-cpu",
    "numpy",
]
das = [
    "websocket-client",
]
dataframes = [
    "pandas",
    "polars",
]
orjson = [
    "orjson",
]
test = [
    "hypothesis>=6.165",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.2",
]
checks = [
    "bandit>=1.9",
    "codespell>=2.4",
    "deptry>=0.25",
    "hypothesis>=6.165",
    "import-linter>=2.13",
    "interrogate>=1.7",
    "mypy>=1.18",
    "perflint>=0.8",
    "pip-audit>=2.9",
    "pylint>=3.3",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.2",
    "radon>=6.0",
    "refurb>=2.3",
    "ruff>=0.14",
    "setuptools>=83",
    "slotscheck>=0.20",
    "ty>=0.0.1a20",
    "vulture>=2.16",
    "xenon>=0.9",
]

[tool.setuptools]
packages = ["petta"]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.package-data]
petta = ["shim.pl", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "petta._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["HE", "examples/**/_common.py"]

[tool.ruff.lint]
select = [
    "F",
    "E", "W",
    "I",
    "UP",
    "B",
    "BLE",
    "S",
    "PL",
    "RUF",
    "FURB",
    "PYI",
    "SIM",
    "C4",
    "PTH",
    "RET",
]
ignore = [
    "E501",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "PLW", "SIM", "RUF059"]
"bench.py" = ["S", "PLW"]
"petta/__init__.py" = ["PLW0603", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["petta"]

[tool.mypy]
python_version = "3.11"
files = ["petta"]
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
no_site_packages = true

[[tool.mypy.overrides]]
module = [
    "array_api_compat", "faiss", "hypothesis", "numpy", "pandas",
    "polars", "websocket",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.interrogate]
fail-under = 40
exclude = ["tests", "HE", "examples", "build"]
ignore-init-module = true
ignore-magic = true
ignore-private = false

[tool.vulture]
min_confidence = 80
paths = ["petta", "bench.py"]
ignore_names = ["exc_type", "exc_val", "exc_tb", "tb", "exc"]

[tool.bandit]
exclude_dirs = ["tests", "HE", "build"]

[tool.deptry]
known_first_party = ["petta"]
extend_exclude = ["HE", "examples", "build"]

[tool.importlinter]
root_package = "petta"

[[tool.importlinter.contracts]]
name = "atoms is the base layer"
type = "forbidden"
source_modules = ["petta.atoms", "petta.errors"]
forbidden_modules = [
    "petta.space", "petta.ops", "petta.define", "petta.convert",
    "petta.integrate", "petta.subscribe",
]

[[tool.importlinter.contracts]]
name = "leaf modules do not import the facade"
type = "forbidden"
source_modules = [
    "petta.subscribe", "petta.foreign", "petta.casting", "petta.trace",
    "petta.lint", "petta.derivation", "petta.results",
]
forbidden_modules = ["petta.space"]
